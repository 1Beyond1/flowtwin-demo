name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-checks:
    name: Node.js check & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Syntax check
        run: npm run check

      - name: Run unit tests
        run: npm test

  python-cv-tests:
    name: Python CV adapter tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Bytecode syntax check
        run: python -m compileall -q cv-service

      - name: Run Python CV unit tests
        run: python -m unittest discover -s cv-service -p "test_*.py" -v
